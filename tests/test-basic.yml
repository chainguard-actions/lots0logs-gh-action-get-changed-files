name: Test basic usage (push event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: changed
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert action ran and outputs are valid JSON arrays or action failed gracefully
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          ALL: ${{ steps.changed.outputs.all }}
          ADDED: ${{ steps.changed.outputs.added }}
          MODIFIED: ${{ steps.changed.outputs.modified }}
          RENAMED: ${{ steps.changed.outputs.renamed }}
          REMOVED: ${{ steps.changed.outputs.removed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "all: $ALL"
          echo "added: $ADDED"
          echo "modified: $MODIFIED"
          echo "renamed: $RENAMED"
          echo "removed: $REMOVED"

          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — validating outputs are JSON arrays"
            for varname in ALL ADDED MODIFIED RENAMED REMOVED; do
              val="${!varname}"
              echo "  $varname = $val"
              if [ -z "$val" ]; then
                echo "FAIL: $varname is empty on success"
                exit 1
              fi
              if ! echo "$val" | python3 -c "import sys, json; data=json.load(sys.stdin); assert isinstance(data, list)" 2>/dev/null; then
                echo "FAIL: $varname is not a valid JSON array: $val"
                exit 1
              fi
            done
            echo "PASS: all outputs are valid JSON arrays"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
